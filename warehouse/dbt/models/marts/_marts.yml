version: 2

models:
  - name: fct_offenses_monthly
    description: One row per level/area/offense/month with offense & clearance rates/actuals and a clearance ratio.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: offense
        tests:
          - not_null
      - name: period
        tests:
          - not_null

  - name: dim_agencies
    description: One row per reporting agency (ORI).
    columns:
      - name: ori
        tests:
          - not_null
          - unique

  - name: dim_population
    description: U.S. Census population by level/area/year — denominator for per-capita metrics.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state"]
      - name: area
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: population
        tests:
          - not_null

  - name: fct_arrests
    description: Arrest demographic breakdowns, per offense.
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_police_employment
    description: Law-enforcement employment by year.
    columns:
      - name: metric
        tests:
          - not_null

  - name: fct_hate_crime
    description: Hate crime incident/offense breakdowns by dimension, per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_shr
    description: Supplementary Homicide Report breakdowns (victim/offense/offender), per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_property
    description: Expanded property (stolen/recovered values, offense analysis) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
          - accepted_values:
              values: ["NB", "NL", "NMVT", "NROB"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_nibrs
    description: NIBRS incident breakdowns (victim/offense/offender) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_lesdc
    description: LE suicide data collection by year, chart type, and S/AS section.
    columns:
      - name: chart_type
        tests:
          - not_null
      - name: section
        tests:
          - not_null
          - accepted_values:
              values: ["S", "AS"]
      - name: value
        tests:
          - not_null

  - name: fct_uof_participation
    description: Use-of-Force national participation summary, one row per year.
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: fct_uof_questions
    description: Use-of-Force report items by year and quest category.
    columns:
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_nibrs_estimation
    description: NIBRS estimated counts by geography (national/region), offense & dimension.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "region"]
      - name: offense
        tests:
          - not_null
      - name: value
        tests:
          - not_null
