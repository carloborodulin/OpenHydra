version: 2

models:
  - name: fct_offenses_monthly
    description: One row per level/area/offense/month with offense & clearance rates/actuals and a clearance ratio.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: offense
        tests:
          - not_null
      - name: period
        tests:
          - not_null

  - name: dim_agencies
    description: One row per reporting agency (ORI).
    columns:
      - name: ori
        tests:
          - not_null
          - unique

  - name: fct_arrests
    description: Arrest demographic breakdowns, per offense.
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_police_employment
    description: Law-enforcement employment by year.
    columns:
      - name: metric
        tests:
          - not_null

  - name: fct_hate_crime
    description: Hate crime incident/offense breakdowns by dimension, per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_shr
    description: Supplementary Homicide Report breakdowns (victim/offense/offender), per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_property
    description: Expanded property (stolen/recovered values, offense analysis) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
          - accepted_values:
              values: ["NB", "NL", "NMVT", "NROB"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_nibrs
    description: NIBRS incident breakdowns (victim/offense/offender) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null
