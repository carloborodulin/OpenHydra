version: 2

models:
  - name: stg_summarized
    description: Monthly offense & clearance series (long format).
    columns:
      - name: series
        tests:
          - accepted_values:
              values: ["offenses", "clearances", "other"]
      - name: measure
        tests:
          - accepted_values:
              values: ["rate", "actual"]
      - name: level
        tests:
          - accepted_values:
              values: ["national", "state", "agency"]

  - name: stg_agencies
    description: One row per reporting agency (ORI).
    columns:
      - name: ori
        tests:
          - not_null

  - name: stg_arrests
    description: Arrest demographic breakdowns (long format).

  - name: stg_police_employment
    description: Law-enforcement employment by year (long format).

  - name: stg_hate_crime
    description: Hate crime incident/offense breakdowns by dimension (long format).

  - name: stg_shr
    description: Supplementary Homicide Report breakdowns by section_dimension (long format).

  - name: stg_property
    description: Expanded property value/count breakdowns by offense & dimension (long format).

  - name: stg_nibrs
    description: NIBRS incident breakdowns by offense & section_dimension (long format).

  - name: stg_lesdc
    description: LE suicide data collection by year, chart type, S/AS section (long format).

  - name: stg_uof_participation
    description: Use-of-Force national participation summary, one row per year.

  - name: stg_uof_questions
    description: Use-of-Force report items by year & quest category (long format).
