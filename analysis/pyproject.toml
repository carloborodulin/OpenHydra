[project]
name = "openhydra-analysis"
version = "0.1.0"
description = "Analysis notebooks over the OpenHydra DuckDB warehouse"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=2.0",
    "polars>=2.1",
    "pandas>=3.1",       # plotly express input (via polars .to_pandas)
    "pyarrow>=26.0",       # polars -> pandas conversion
    "plotly>=7.1",
    "kaleido>=1.5",      # static PNG export for plotly
    "jupytext>=1.19",    # pairs the percent-format .py with .ipynb
]

[tool.uv]
package = false          # this is an environment, not a distributable package

[dependency-groups]
dev = [
    "jupyterlab>=4.6",
    "ipykernel>=7.4",
    "nbconvert>=7.17",
]

[tool.ruff]
line-length = 100
