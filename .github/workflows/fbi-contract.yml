# Once a day, check the FBI CDE routes that the extract depends on, with two
# API requests. The national UoF participation route returned 404 at the
# 2026-11-22 audit; this check reports such a change before the monthly
# refresh meets it. A failure opens an issue.
name: fbi contract

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC each day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: data-refresh
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.19"
      - name: Check the routes
        env:
          FBI_CDE_API_KEY: ${{ secrets.FBI_CDE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        working-directory: cdeclient
        run: |
          uv sync --frozen
          set +e
          out=$(uv run --frozen python scripts/contract_check.py 2>&1)
          rc=$?
          set -e
          echo "$out"
          # One issue: a comment each day while it fails, closed when it passes.
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title FBI API contract check failed" --json number --jq '.[0].number')
          if [ $rc -ne 0 ]; then
            printf 'The daily check of the FBI routes failed on %s. The extract keeps the last good data of a failed domain.\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%d)" "$(echo "$out" | tail -5)" > issue.md
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "FBI API contract check failed" --body-file issue.md; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The FBI routes answer as expected again."
          fi
