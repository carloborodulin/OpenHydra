<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHydra — UCR Command</title>
    <meta
      name="description"
      content="End-to-end analytics dashboard for U.S. crime statistics from the FBI Crime Data Explorer (CDE) API — 11 data domains across all 50 states and ~19,600 agencies. FastAPI · DuckDB · dbt · React."
    />
    <meta name="theme-color" content="#04070d" />

    <!-- Favicon / app icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph — link previews on LinkedIn, Slack, iMessage, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenHydra" />
    <meta property="og:title" content="OpenHydra — FBI Crime Data Explorer dashboard" />
    <meta
      property="og:description"
      content="End-to-end analytics dashboard for U.S. crime statistics from the FBI Crime Data Explorer (CDE) API — 11 data domains across all 50 states and ~19,600 agencies."
    />
    <meta property="og:url" content="https://openhydra-production.up.railway.app/" />
    <meta property="og:image" content="https://openhydra-production.up.railway.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OpenHydra dashboard — crime trend charts and a U.S. law-enforcement agency map."
    />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenHydra — FBI Crime Data Explorer dashboard" />
    <meta
      name="twitter:description"
      content="End-to-end analytics dashboard for U.S. crime statistics from the FBI Crime Data Explorer (CDE) API — 11 data domains across all 50 states and ~19,600 agencies."
    />
    <meta name="twitter:image" content="https://openhydra-production.up.railway.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so returning light-mode users don't
      // flash the dark default. Mirrors lib/theme.tsx (key "oh-theme").
      try {
        var t = localStorage.getItem("oh-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
