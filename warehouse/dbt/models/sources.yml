version: 2

sources:
  - name: raw
    description: Long-format Parquet landed by `oh-etl pull` under data/raw/.
    meta:
      # {name} is replaced with the table name below; path is relative to the
      # directory dbt is invoked from (warehouse/dbt).
      external_location: "read_parquet('../../data/raw/{name}.parquet')"
    tables:
      - name: summarized
      - name: agencies
      - name: arrests
      - name: pe
      - name: hate_crime
      - name: shr
      - name: property
      - name: nibrs
      - name: lesdc
      - name: uof_participation
      - name: uof_questions
      - name: nibrs_estimation

  - name: seeds
    description: Committed, version-controlled reference CSVs under data/seeds/.
    meta:
      external_location: "read_csv_auto('../../data/seeds/{name}.csv')"
    tables:
      # U.S. Census population estimates (state + national, 2015-2024). See
      # warehouse/scripts/fetch_population.py for provenance.
      - name: population
