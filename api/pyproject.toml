[project]
name = "openhydra-api"
version = "0.1.0"
description = "FastAPI service exposing the OpenHydra DuckDB marts as JSON"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "duckdb>=2.0",
    "pydantic>=2.14",
    "cdeclient",
]

[project.scripts]
oh-api = "openhydra_api.main:run"

[tool.uv.sources]
cdeclient = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra_api"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",   # FastAPI TestClient
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
