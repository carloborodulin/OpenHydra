# Run the production image on this computer: docker compose up --build
# The dashboard and the API are on http://127.0.0.1:8000. Without a .env file
# the warehouse views work, and the live agency views answer 503.
services:
  openhydra:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
