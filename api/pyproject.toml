[project]
name = "openhydra-api"
version = "0.1.0"
description = "FastAPI service exposing the OpenHydra DuckDB marts as JSON"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
oh-api = "openhydra_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra_api"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # FastAPI TestClient
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
