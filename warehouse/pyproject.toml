[project]
name = "openhydra-etl"
version = "0.1.0"
description = "ETL that pulls FBI CDE data into a DuckDB/Parquet warehouse for OpenHydra"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cdeclient",
    "duckdb>=1.0",
    "polars>=1.0",
    "typer>=0.12",
]

[project.scripts]
oh-etl = "openhydra_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra_etl"]

[tool.uv.sources]
cdeclient = { path = "../cdeclient", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openhydra_etl.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
