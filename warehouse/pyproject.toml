[project]
name = "openhydra-etl"
version = "0.1.0"
description = "ETL that pulls FBI CDE data into a DuckDB/Parquet warehouse for OpenHydra"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cdeclient",
    "polars>=2.1",
    "typer>=0.29",
]

[project.scripts]
oh-etl = "openhydra_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra_etl"]

[tool.uv.sources]
cdeclient = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
]
# Heavy; install on demand with `uv sync --group dbt`. Kept out of the default
# env so lint/type/test stays fast.
dbt = [
    "dbt-duckdb>=1.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openhydra_etl.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
