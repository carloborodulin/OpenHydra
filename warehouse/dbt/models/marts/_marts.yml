version: 2

models:
  - name: fct_offenses_monthly
    description: One row per level/area/offense/month with offense & clearance rates/actuals and a clearance ratio.
    tests:
      - unique_combination:
          arguments:
            columns: [level, area, offense, period]
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["national", "state", "agency"]
      - name: offense
        tests:
          - not_null
      - name: period
        tests:
          - not_null

  - name: dim_agencies
    description: One row per reporting agency (ORI).
    columns:
      - name: ori
        tests:
          - not_null
          - unique

  - name: dim_population
    description: U.S. Census population by level/area/year — denominator for per-capita metrics.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["national", "state"]
      - name: area
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: population
        tests:
          - not_null

  - name: fct_arrests
    description: >
      Arrest demographic breakdowns per offense. Rows from the API have
      is_derived = false. The violent-crime and property-crime rows are the
      sum of their four Part I offenses (is_derived = true).
    tests:
      - unique_combination:
          arguments:
            columns: [level, area, offense, category, label]
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: window_from
        tests:
          - not_null
      - name: is_derived
        tests:
          - not_null

  - name: fct_police_employment
    description: Law-enforcement employment by year.
    columns:
      - name: metric
        tests:
          - not_null

  - name: fct_hate_crime
    description: Hate crime incident/offense breakdowns by dimension, per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_shr
    description: Supplementary Homicide Report breakdowns (victim/offense/offender), per level/area.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["national", "state", "agency"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_property
    description: Expanded property (stolen/recovered values, offense analysis) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NB", "NL", "NMVT", "NROB"]
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_nibrs
    description: NIBRS incident breakdowns (victim/offense/offender) by offense & dimension.
    columns:
      - name: offense
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_lesdc
    description: LE suicide data collection by year, chart type, and S/AS section.
    columns:
      - name: chart_type
        tests:
          - not_null
      - name: section
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["S", "AS"]
      - name: value
        tests:
          - not_null

  - name: fct_uof_participation
    description: Use-of-Force national participation summary, one row per year.
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: fct_uof_questions
    description: Use-of-Force report items by year and quest category.
    columns:
      - name: category
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: fct_nibrs_estimation
    description: NIBRS estimated counts by geography (national/region), offense & dimension.
    columns:
      - name: level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["national", "region"]
      - name: offense
        tests:
          - not_null
      - name: value
        tests:
          - not_null

  - name: meta_snapshot
    description: The release manifest of the snapshot, as one row.
    tests:
      - unique_combination:
          arguments:
            columns: [release_id]
    columns:
      - name: release_id
        tests:
          - not_null
      - name: extracted_at_max
        tests:
          - not_null
      - name: window_from
        tests:
          - not_null

  - name: meta_snapshot_domains
    description: One row per file of the release, with its extraction date and window.
    columns:
      - name: domain
        tests:
          - not_null
          - unique
      - name: row_count
        tests:
          - not_null

unit_tests:
  - name: ttm_needs_12_calendar_months
    description: >
      A missing month (June 2019) leaves 11 months in each window that holds it,
      so the TTM rate and the 2019 baseline are null. A ROWS window would reach
      back 13 months instead.
    model: fct_offenses_monthly
    given:
      - input: ref('stg_summarized')
        format: sql
        rows: |
          select 'national' as level, 'US' as area, 'x' as offense,
                 'offenses' as series, 'rate' as measure,
                 cast(d as date) as period, 10.0 as value
          from generate_series(date '2019-01-01', date '2020-01-01', interval 1 month) as g(d)
          where d <> date '2019-06-01'
    expect:
      format: sql
      rows: |
        select 'national' as level, 'US' as area, 'x' as offense,
               cast(d as date) as period,
               10.0 as offenses_rate,
               cast(null as double) as offenses_actual,
               cast(null as double) as clearances_rate,
               cast(null as double) as clearances_actual,
               cast(null as double) as clearance_ratio,
               cast(case when d = date '2020-01-01' then 11
                         when d < date '2019-06-01' then month(d)
                         else month(d) - 1 end as bigint) as ttm_months,
               cast(null as double) as ttm_rate,
               cast(null as double) as yoy_delta,
               cast(null as double) as index_2019
        from generate_series(date '2019-01-01', date '2020-01-01', interval 1 month) as g(d)
        where d <> date '2019-06-01'

  - name: index_is_100_in_december_2019
    description: >
      With 2019 at 120 and 2020 at 240 per month, the TTM rate is null for the
      first 11 months, 120 in December 2019 (index 100) and 120 + 10m in month m
      of 2020.
    model: fct_offenses_monthly
    given:
      - input: ref('stg_summarized')
        format: sql
        rows: |
          select 'national' as level, 'US' as area, 'x' as offense,
                 'offenses' as series, 'rate' as measure,
                 cast(d as date) as period,
                 case when year(d) = 2019 then 120.0 else 240.0 end as value
          from generate_series(date '2019-01-01', date '2020-12-01', interval 1 month) as g(d)
    expect:
      format: sql
      rows: |
        select 'national' as level, 'US' as area, 'x' as offense,
               cast(d as date) as period,
               case when year(d) = 2019 then 120.0 else 240.0 end as offenses_rate,
               cast(null as double) as offenses_actual,
               cast(null as double) as clearances_rate,
               cast(null as double) as clearances_actual,
               cast(null as double) as clearance_ratio,
               cast(case when year(d) = 2019 then month(d) else 12 end as bigint) as ttm_months,
               case when d < date '2019-12-01' then null
                    when year(d) = 2019 then 120.0
                    else cast(120 + 10 * month(d) as double) end as ttm_rate,
               case when d = date '2020-12-01' then 240.0 / 120.0 - 1 end as yoy_delta,
               case when d < date '2019-12-01' then null
                    when year(d) = 2019 then 120.0 / 120.0 * 100
                    else cast(120 + 10 * month(d) as double) / 120.0 * 100 end as index_2019
        from generate_series(date '2019-01-01', date '2020-12-01', interval 1 month) as g(d)
